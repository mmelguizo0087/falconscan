# Parámetros de Falcon Scan: un solo archivo para los dos nodos del pórtico.
#   velocity_node: 1:1 con VelocityParams (falconscan_velocity/core/estimator.py)
#   volume_node:   1:1 con VolumeParams   (falconscan_volume/core/params.py)
# Los dos LiDAR usan los mismos nombres de montaje/calibración (mount_height_m,
# angle_offset_rad, angle_direction, range_bias_m, floor_z_m), cada uno con sus valores.
#
# IMPORTANTE: los parámetros float deben escribirse con punto decimal (5.0, no 5) o ROS 2
# rechazará el tipo. Hay pruebas que verifican nombres y tipos de las dos secciones.
#
# Los valores de MONTAJE son provisionales hasta la ficha de calibración (reporte §6, fase 0).
velocity_node:
  ros__parameters:
    # --- Montaje: plano de escaneo vertical que CONTIENE el eje de avance ---
    mount_height_m: 2.216          # altura del origen óptico sobre el piso  [MEDIR]
    # Convención de instalación (2026-10-21): la flecha de 0° del S2E apunta al piso. Con
    # sllidar_ros2 (inverted:=false) esa flecha es el rayo ROS 180° -> offset = −π/2 − π ≡ +π/2.
    # Es el valor NOMINAL: la calibración mide el desvío de la flecha y no lo sobrescribe.
    angle_offset_rad: 1.5707963  # rayo ROS 180° (flecha 0°) apunta al nadir
    angle_direction: 1           # -1 si el sensor está montado invertido  [VERIFICAR]
    x_offset_m: 0.0
    floor_z_m: 0.0
    # Corrección de rango r_corr = (r − range_bias_m) · range_scale. Calibrada en prueba de
    # pared (20-oct-2026) para la unidad 1 (S/N 508BFA92C3E49EC6A5EB9AF3C6565566): el sensor
    # mide de más ≈ 2.7 mm + 0.43 % · d. Rehacer si se cambia de unidad. El launch la anula con use_sim.
    range_bias_m: 0.0027
    range_scale: 0.995753

    # --- Validación / filtrado ---
    range_min_m: 0.2
    range_max_m: 12.0
    median_window: 3
    median_max_spread_m: 0.15
    # Abanico de interés: solo se usan los rayos a menos de fan_angle_rad/2 de fan_center_rad,
    # medidos en el marco mundo desde la vertical hacia abajo (+ hacia +x); el resto queda NaN.
    # Sigue al nadir calibrado. Quita el soporte y lo que está por encima del sensor (D16).
    # 6.2831853 (360°) = sin filtro. Para cubrir la ROI hasta |x| = X: apertura > 2·atan(X / H).
    fan_angle_rad: 2.0943951     # 120°: piso visto hasta |x| = 3.84 m con H = 2.216 m
    fan_center_rad: 0.0          # 0 = centrado en el nadir

    # --- Malla / ROI longitudinal ---
    roi_x_min_m: -3.0
    roi_x_max_m: 3.0
    grid_dx_m: 0.02
    roi_z_max_m: 4.5             # por encima: estructura del pórtico, se descarta

    # --- Segmentación ---
    object_h_threshold_m: 0.4
    object_min_bins: 25
    object_min_run_bins: 5
    empty_reset_scans: 5         # vacíos seguidos para reiniciar el historial; uno aislado se salta

    # --- Correlación ---
    baseline_scans: 3
    v_min_mps: -0.5              # solo con search_mode sentido/fija
    v_max_mps: 6.0
    search_mode: "simetrica"     # simetrica | sentido | fija (fija = solo +x, comportamiento original)
    min_overlap_bins: 60
    min_profile_std_m: 0.05
    peak_exclusion_bins: 3
    deskew_iterations: 1
    # true con sllidar_ros2 (inverted:=false): ranges[0] es el último rayo medido. Si no
    # coincide con el driver, el deskew corrige con el signo al revés. El launch lo pone
    # en false con use_sim:=true (el simulador publica en orden de medición).
    scan_time_reversed: true

    # --- Aceptación ---
    min_peak: 0.85
    min_prominence: 0.05
    max_dt_s: 0.5
    max_accel_mps2: 3.0
    accel_margin_mps: 0.3

    # --- Filtro temporal (solo visualización; NO usar para integrar posición) ---
    ema_alpha: 0.4

    # --- Paso de camión (PassTracker, docs/maquina_estados_paso.md §2) ---
    # Valores iniciales para 5–10 km/h, 10 Hz y ROI de 6 m; ajustar con pasos reales.
    pass_enter_scans: 3          # ocupados para confirmar entrada (0.3 s)
    pass_exit_scans: 5           # vacíos para cerrar el paso (tolera huecos de 0.4 s)
    pass_empty_scans: 5          # vacíos para salir de ARRANQUE / OBSTRUIDO
    pass_max_s: 30.0             # ocupación más larga -> TIMEOUT y OBSTRUIDO
    scan_timeout_s: 0.5          # sin escaneos -> SIN_DATOS
    pass_edge_margin_m: 1.0      # franja de borde para validar entrada/salida
    pass_v_min_mps: 1.39         # 5 km/h
    pass_v_max_mps: 2.78         # 10 km/h (equipo, 2026-10-21: 5–10 km/h para favorecer el escaneo)
    pass_v_tolerance_mps: 0.3
    pass_reverse_v_mps: -0.2     # v OK por debajo cuenta como reversa
    pass_reverse_scans: 3
    pass_min_valid_fraction: 0.6 # provisional: el simulador da 70–80 % de escaneos OK (ocupados)

    # --- Calibración con el piso (provisionales hasta caracterizar el S2E en el sitio) ---
    cal_offset_tol_ok_m: 0.03    # |offset de rango| hasta aquí: «Altura OK»; si no, se corrige
    cal_offset_tol_max_m: 0.20   # mayor: FALLA, revisar montaje del sensor (equipo, 2026-10-21)
    cal_angle_tol_ok_rad: 0.0087 # 0.5° de desvío de la flecha 0°: «Rotación OK»
    cal_angle_tol_max_rad: 0.0873  # 5°: FALLA, soporte flojo o mal instalado

    # --- Referencia de signo SOLO para mostrar (visor/HMI). Los mensajes ROS van siempre en el
    #     marco mundo (+x): el volume_node integra velocity_mps tal como sale (D20) ---
    invert_velocity_sign: false  # false: positivo = hacia +x (x mín -> x máx); true: al revés

    publish_profile: false

# =============================================================================================
# Reconstructor de volumen (LiDAR transversal). Justificación de cada valor:
# docs/maquina_estados_volumen.md §4.
volume_node:
  ros__parameters:
    # --- Montaje del LiDAR de volumen: plano de escaneo TRANSVERSAL (y–z) ---
    mount_height_m: 5.0          # piso -> centro óptico del sensor                 [MEDIR]
    # θ = 0 al nadir (simulador 3D). Un S2E real con la flecha 0° hacia el piso publica el nadir en
    # ROS 180° -> +1.5707963, como el LiDAR de velocidad (D15). [VERIFICAR con el sensor montado]
    angle_offset_rad: -1.5707963 # 0° al nadir                                      [CALIBRAR]
    angle_direction: 1
    y_offset_m: 0.0              # posición lateral del sensor respecto al eje del carril
    floor_z_m: 0.0
    range_bias_m: 0.0

    # --- Relación entre los dos LiDAR ---
    # Distancia, sobre el eje de avance x, del centro de rotación del LiDAR de velocidad al
    # plano de corte del LiDAR transversal (positivo hacia +x del LiDAR de velocidad). Si
    # x_offset_m del LiDAR de velocidad no es 0, es la posición del plano en ese marco x.
    vol_plane_offset_m: 0.0      #                                                   [MEDIR]
    vel_plane_y_m: 0.0           # posición lateral del plano de velocidad (marco transversal)
    vol_time_offset_s: 0.0       # corrección de reloj/latencia; ajustar con sync_offset_s

    # --- Validación / filtrado ---
    range_min_m: 0.2
    range_max_m: 12.0
    median_window: 3
    median_max_spread_m: 0.15

    # --- ROI lateral y malla ---
    vol_roi_y_min_m: -2.0
    vol_roi_y_max_m: 2.0
    vol_roi_z_max_m: 4.5
    vol_grid_dy_m: 0.02
    vol_edge_margin_m: 0.10

    # --- Segmentación del perfil ---
    vol_h_threshold_m: 0.4
    vol_object_min_width_m: 0.5
    vol_object_min_run_m: 0.2
    vol_max_nan_run_m: 0.20
    vol_floor_drift_tol_m: 0.05
    vol_min_data_fraction: 0.3   # menos celdas con dato: escaneo SIN DATO (no es un perfil vacío)

    # --- Ciclo de captura ---
    vol_enter_scans: 2
    vol_preroll_scans: 4
    vol_empty_scans: 5
    vol_exit_gap_m: 1.5          # recorrido vacío para cerrar (mayor que cabina–volco)  [MEDIR volquetas]
    vol_exit_max_s: 3.0
    vol_max_capture_s: 30.0
    scan_timeout_s: 0.5

    # --- Velocidad ---
    vel_timeout_s: 0.5
    vol_velocity_margin_s: 0.1
    vol_close_wait_s: 3.0        # espera máx. de la velocidad y del FIN del paso
    vol_v_max_gap_s: 1.0         # hueco de velocidad interpolable
    vol_max_v_interp_fraction: 0.3

    # --- Integración ---
    vol_merge_dx_m: 0.02
    vol_max_dx_m: 0.6
    vol_edge_from_velocity: true # frente y cola ubicados con el LiDAR de velocidad

    # --- Chequeos de la medición ---
    vol_min_profiles: 10
    vol_min_length_m: 3.0        # objeto más corto: no reconocible -> DESCARTADA
    vol_max_length_m: 20.0       # más largo: INVALIDA (p. ej. dos camiones pegados)
    vol_max_truncated_fraction: 0.05
    vol_max_nan_fraction: 0.10
    vol_max_shadow_fraction: 0.10
    vol_max_center_offset_m: 0.5 # |centro transversal mediano| -> DESCENTRADO (anula)
    vol_max_lateral_dev_m: 0.3   # desvío del centro respecto a su mediana -> CONDUCCION_NO_PARALELA (anula)
    vol_sync_tol_s: 0.15         # |Δt_sync| entre LiDAR -> DESINCRONIZADO (anula)
    vol_max_incoherent_fraction: 0.2

    # --- Salidas ---
    vol_cloud_live: true
    vol_export_dir: ""           # carpeta de la SD para .ply + .json; vacío = no exporta
    pass_frame_id: "falconscan_paso"
