# Parámetros de velocity_node. Los nombres coinciden 1:1 con VelocityParams (core/estimator.py).
# IMPORTANTE: los parámetros float deben escribirse con punto decimal (5.0, no 5) o ROS 2
# rechazará el tipo.
#
# Los valores de MONTAJE son provisionales hasta la ficha de calibración (reporte §6, fase 0).
velocity_node:
  ros__parameters:
    # --- Montaje: plano de escaneo vertical que CONTIENE el eje de avance ---
    mount_height_m: 5.0          # altura del origen óptico sobre el piso  [MEDIR]
    angle_offset_rad: -1.5707963 # theta = 0 apunta al nadir               [CALIBRAR]
    angle_direction: 1           # -1 si el sensor está montado invertido  [VERIFICAR]
    x_offset_m: 0.0
    floor_z_m: 0.0
    # Corrección de rango r_corr = (r − range_bias_m) · range_scale. Calibrada en prueba de
    # pared (20-oct-2026) para la unidad 1 (S/N 508BFA92C3E49EC6A5EB9AF3C6565566): el sensor
    # mide de más ≈ 2.7 mm + 0.43 % · d. Rehacer si se cambia de unidad. El launch la anula con use_sim.
    range_bias_m: 0.0027
    range_scale: 0.995753

    # --- Validación / filtrado ---
    range_min_m: 0.2
    range_max_m: 12.0
    median_window: 3
    median_max_spread_m: 0.15

    # --- Malla / ROI longitudinal ---
    roi_x_min_m: -3.0
    roi_x_max_m: 3.0
    grid_dx_m: 0.02
    roi_z_max_m: 4.5             # por encima: estructura del pórtico, se descarta

    # --- Segmentación ---
    object_h_threshold_m: 0.4
    object_min_bins: 25
    object_min_run_bins: 5

    # --- Correlación ---
    baseline_scans: 3
    v_min_mps: -0.5
    v_max_mps: 6.0
    min_overlap_bins: 60
    min_profile_std_m: 0.05
    peak_exclusion_bins: 3
    deskew_iterations: 1
    # true con sllidar_ros2 (inverted:=false): ranges[0] es el último rayo medido. Si no
    # coincide con el driver, el deskew corrige con el signo al revés. El launch lo pone
    # en false con use_sim:=true (el simulador publica en orden de medición).
    scan_time_reversed: true

    # --- Aceptación ---
    min_peak: 0.85
    min_prominence: 0.05
    max_dt_s: 0.5
    max_accel_mps2: 3.0
    accel_margin_mps: 0.3

    # --- Filtro temporal (solo visualización; NO usar para integrar posición) ---
    ema_alpha: 0.4

    publish_profile: false
